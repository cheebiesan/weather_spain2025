<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Forecast Widget</title>
<link rel="stylesheet" href="weather.css">
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f7f7f7;
    }
    #loading {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    .day-block {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
</style>
</head>
<body>

<h2>Trip Weather Forecast</h2>

<div id="loading">Loading latest forecasts...</div>
<div id="weather-container"></div>

<script>
// -------------------------------
// FIX: PAGE INIT ALWAYS RUNS
// -------------------------------
window.onload = function () {
    console.log("Window loaded → starting weather fetch");
    loadWeatherData();
};

// -------------------------------
// LOCATIONS + DATES
// -------------------------------
const DAYS = [
    { date: "2025-11-23", label: "Nov 23 – Madrid", lat: 40.4168, lon: -3.7038 },
    { date: "2025-11-24", label: "Nov 24 – Madrid", lat: 40.4168, lon: -3.7038 },
    { date: "2025-11-25", label: "Nov 25 – Madrid", lat: 40.4168, lon: -3.7038 },
    { date: "2025-11-25", label: "Nov 25 – Segovia", lat: 40.9481, lon: -4.1184 },
    { date: "2025-11-26", label: "Nov 26 – Madrid", lat: 40.4168, lon: -3.7038 },
    { date: "2025-11-27", label: "Nov 27 – Barcelona", lat: 41.3851, lon: 2.1734 },
    { date: "2025-11-29", label: "Nov 29 – Gibraltar", lat: 36.1408, lon: -5.3536 },
    { date: "2025-12-01", label: "Dec 1 – Lanzarote", lat: 29.0469, lon: -13.58997 },
    { date: "2025-12-02", label: "Dec 2 – Tenerife", lat: 28.2916, lon: -16.6291 },
    { date: "2025-12-03", label: "Dec 3 – Gran Canaria", lat: 28.1235, lon: -15.4363 },
    { date: "2025-12-05", label: "Dec 5 – Casablanca", lat: 33.5731, lon: -7.5898 },
    { date: "2025-12-06", label: "Dec 6 – Tangier", lat: 35.7595, lon: -5.8339 },
    { date: "2025-12-07", label: "Dec 7 – Málaga", lat: 36.7213, lon: -4.4214 },
    { date: "2025-12-09", label: "Dec 9 – Barcelona", lat: 41.3851, lon: 2.1734 }
];


// --------------------------------------------------
// FUNCTION: Load all forecasts
// --------------------------------------------------
async function loadWeatherData() {
    const container = document.getElementById("weather-container");
    const loading = document.getElementById("loading");

    // Safety timeout → prevents infinite “Loading…”
    setTimeout(() => {
        if (loading.style.display !== "none") {
            loading.textContent = "⚠️ Weather forecast is taking longer than expected...";
        }
    }, 8000);

    for (const day of DAYS) {
        console.log("Fetching weather for:", day.label);

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${day.lat}` +
                    `&longitude=${day.lon}` +
                    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode` +
                    `&timezone=auto&start_date=${day.date}&end_date=${day.date}`;

        try {
            const response = await fetch(url);

            if (!response.ok) throw new Error("API error");

            const data = await response.json();
            console.log("Data received:", data);

            if (!data.daily || !data.daily.temperature_2m_max) {
                container.innerHTML += `<div class="day-block">
                    <strong>${day.label}</strong><br>
                    ❌ Forecast unavailable
                </div>`;
                continue;
            }

            const highC = data.daily.temperature_2m_max[0];
            const lowC = data.daily.temperature_2m_min[0];
            const rain = data.daily.precipitation_probability_max[0];
            const weatherCode = data.daily.weathercode[0];

            const highF = Math.round((highC * 9/5) + 32);
            const lowF = Math.round((lowC * 9/5) + 32);

            container.innerHTML += `
                <div class="day-block">
                    <strong>${day.label}</strong><br>
                    High: ${highF}°F — Low: ${lowF}°F<br>
                    Chance of rain: ${rain}%<br>
                    Weather code: ${weatherCode}
                </div>
            `;

        } catch (err) {
            console.error("Fetch error:", err);

            container.innerHTML += `<div class="day-block">
                <strong>${day.label}</strong><br>
                ❌ Error fetching data
            </div>`;
        }
    }

    loading.style.display = "none";
}

</script>
</body>
</html>
